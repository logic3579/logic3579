name: Update Metrics

on:
  # Schedule daily updates
  schedule: [{ cron: "33 3 * * *" }]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: { branches: ["main", "master"] }

permissions:
  contents: write

# Shared with snake.yml so they never race when both push to the `output` branch.
concurrency:
  group: output-branch
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Classic Metrics
        uses: lowlighter/metrics@v4
        with:
          filename: metrics.classic.svg
          committer_branch: output
          token: ${{ secrets.GITHUB_TOKEN }}
          base: header, repositories
          plugin_lines: yes
      - name: Starred repositories
        uses: lowlighter/metrics@v4
        with:
          filename: metrics.plugin.repositories.starred.svg
          committer_branch: output
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          plugin_repositories: yes
          plugin_repositories_starred: 10
      - name: Full history calendar
        uses: lowlighter/metrics@v4
        with:
          filename: metrics.plugin.calendar.full.svg
          committer_branch: output
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 0
