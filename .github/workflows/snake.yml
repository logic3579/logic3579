name: Generate Snake

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Shared with metrics.yml so they never race when both push to the `output` branch.
concurrency:
  group: output-branch
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution snake
        # Platane/snk@v3
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Basic auth via header — token never appears in the remote URL.
          auth_header() {
            printf 'AUTHORIZATION: basic %s' "$(printf '%s:%s' "$1" "$2" | base64 | tr -d '\n')"
          }
          github_auth="$(auth_header x-access-token "$GITHUB_TOKEN")"
          git_gh() {
            git -c "http.https://github.com/.extraheader=${github_auth}" "$@"
          }

          work=$(mktemp -d)
          remote="https://github.com/${GITHUB_REPOSITORY}.git"

          # If the output branch already exists, append on top of it so we don't
          # wipe metrics SVGs. Otherwise create it as a fresh orphan branch.
          if git_gh ls-remote --exit-code --heads "$remote" output >/dev/null 2>&1; then
            git_gh clone --depth=1 --single-branch --branch=output "$remote" "$work"
            cp dist/snake.svg "$work/snake.svg"
            cp dist/snake-dark.svg "$work/snake-dark.svg"
            cd "$work"
            git add snake.svg snake-dark.svg
            if git diff --cached --quiet; then
              echo "No changes to snake SVGs"
              exit 0
            fi
            git commit -m "chore: update contribution snake"
            git_gh push origin output
          else
            cd "$work"
            git init -q -b output
            git remote add origin "$remote"
            cp "$GITHUB_WORKSPACE/dist/snake.svg" snake.svg
            cp "$GITHUB_WORKSPACE/dist/snake-dark.svg" snake-dark.svg
            git add snake.svg snake-dark.svg
            git commit -m "chore: seed output branch with snake SVGs"
            git_gh push -u origin output
          fi
