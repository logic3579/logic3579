name: Sync GitHub Repos to GitLab and Gitee

on:
  workflow_dispatch:
  schedule:
    # Every Sunday at 03:00 UTC
    - cron: "0 3 * * 0"

concurrency:
  group: sync-repos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  list_repos:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - name: List owned repositories
        id: list
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const all = await github.paginate(
              github.rest.repos.listForAuthenticatedUser,
              { per_page: 100, affiliation: 'owner', sort: 'full_name' }
            );
            const repos = all
              .filter(r => !r.fork && !r.archived)
              .map(r => ({
                name: r.name,
                private: r.private,
                // 100 chars keeps the matrix outputs well under the 1MB job-output cap
                // even when the user has hundreds of repos.
                description: (r.description || '').slice(0, 100),
                default_branch: r.default_branch,
              }));
            core.setOutput('repos', JSON.stringify(repos));
            core.setOutput('count', String(repos.length));
            await core.summary
              .addHeading(`Syncing ${repos.length} repositories`)
              .addList(repos.map(r => `${r.name}${r.private ? ' (private)' : ''}`))
              .write();

  sync:
    needs: list_repos
    if: needs.list_repos.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        repo: ${{ fromJSON(needs.list_repos.outputs.repos) }}
    steps:
      - name: Mirror clone from GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ matrix.repo.name }}
        run: |
          git clone --mirror \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${REPO}.git" \
            repo.git
          # refs/pull/* are GitHub-only PR refs that Gitee rejects as hidden refs.
          git -C repo.git for-each-ref --format='delete %(refname)' refs/pull \
            | git -C repo.git update-ref --stdin

      - name: Sync to GitLab
        id: sync_gitlab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ matrix.repo.name }}
          DESC: ${{ matrix.repo.description }}
          PRIVATE: ${{ matrix.repo.private }}
          DEFAULT_BRANCH: ${{ matrix.repo.default_branch }}
        run: |
          encoded="${OWNER}%2F${REPO}"
          url="https://oauth2:${GITLAB_TOKEN}@gitlab.com/${OWNER}/${REPO}.git"

          status=$(curl -s --retry 3 --retry-delay 5 -o /dev/null -w "%{http_code}" \
            -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            "https://gitlab.com/api/v4/projects/${encoded}")

          if [ "$status" = "404" ]; then
            visibility=$([ "$PRIVATE" = "true" ] && echo private || echo public)
            payload=$(jq -n \
              --arg name "$REPO" --arg desc "$DESC" \
              --arg vis "$visibility" --arg branch "$DEFAULT_BRANCH" \
              '{name: $name, description: $desc, visibility: $vis, default_branch: $branch}')
            curl -sSf -X POST \
              -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "https://gitlab.com/api/v4/projects" > /dev/null
            echo "Created GitLab project ${OWNER}/${REPO}"
          elif [ "$status" != "200" ]; then
            echo "::error::GitLab API returned $status for ${REPO}"
            exit 1
          fi

          # GitLab is lenient about HEAD/default-branch reassignment during mirror
          # push, so a single mirror push suffices.
          git -C repo.git push --mirror "$url"

      - name: Sync to Gitee
        if: always() && steps.sync_gitlab.conclusion != 'cancelled'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ matrix.repo.name }}
          DESC: ${{ matrix.repo.description }}
          PRIVATE: ${{ matrix.repo.private }}
          DEFAULT_BRANCH: ${{ matrix.repo.default_branch }}
        run: |
          url="https://${OWNER}:${GITEE_TOKEN}@gitee.com/${OWNER}/${REPO}.git"

          status=$(curl -s --retry 3 --retry-delay 5 -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GITEE_TOKEN" \
            "https://gitee.com/api/v5/repos/${OWNER}/${REPO}")

          if [ "$status" = "404" ]; then
            payload=$(jq -n \
              --arg name "$REPO" --arg desc "$DESC" --argjson private "$PRIVATE" \
              '{name: $name, description: $desc, private: $private}')
            curl -sSf -X POST \
              -H "Authorization: token $GITEE_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "https://gitee.com/api/v5/user/repos" > /dev/null
            echo "Created Gitee repo ${OWNER}/${REPO}"
          elif [ "$status" != "200" ]; then
            echo "::error::Gitee API returned $status for ${REPO}"
            exit 1
          fi

          # Push heads/tags first so the source's default branch exists on the target
          # before we realign it — Gitee refuses to delete the current default branch
          # during a mirror push.
          git -C repo.git push "$url" --all
          git -C repo.git push "$url" --tags
          # PATCH requires `name`; enforce default_branch and visibility (Gitee's own
          # account-level default is `private: true` regardless of the POST payload).
          curl -sSf -X PATCH \
            -H "Authorization: token $GITEE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
                  --arg n "$REPO" --arg b "$DEFAULT_BRANCH" --argjson p "$PRIVATE" \
                  '{name: $n, default_branch: $b, private: $p}')" \
            "https://gitee.com/api/v5/repos/${OWNER}/${REPO}" > /dev/null
          # Final mirror push prunes refs that no longer exist on source.
          git -C repo.git push --mirror "$url"
