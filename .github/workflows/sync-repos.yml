name: Sync GitHub Repos to GitLab and Gitee

on:
  workflow_dispatch:
  schedule:
    # Every Sunday at 03:00 UTC
    - cron: "0 3 * * 0"

concurrency:
  group: sync-repos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  list_repos:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - name: List owned repositories
        id: list
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const all = await github.paginate(
              github.rest.repos.listForAuthenticatedUser,
              { per_page: 100, affiliation: 'owner', sort: 'full_name' }
            );
            const self = context.repo.repo;
            const repos = all
              .filter(r => !r.fork && !r.archived && r.name !== self)
              .map(r => ({
                name: r.name,
                private: r.private,
                description: (r.description || '').slice(0, 250),
              }));
            core.setOutput('repos', JSON.stringify(repos));
            core.setOutput('count', String(repos.length));
            await core.summary
              .addHeading(`Syncing ${repos.length} repositories`)
              .addList(repos.map(r => `${r.name}${r.private ? ' (private)' : ''}`))
              .write();

  sync:
    needs: list_repos
    if: needs.list_repos.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        repo: ${{ fromJSON(needs.list_repos.outputs.repos) }}
    steps:
      - name: Mirror clone from GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ matrix.repo.name }}
        run: |
          git clone --mirror \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${REPO}.git" \
            repo.git

      - name: Ensure GitLab project exists
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ matrix.repo.name }}
          DESC: ${{ matrix.repo.description }}
          PRIVATE: ${{ matrix.repo.private }}
        run: |
          encoded="${OWNER}%2F${REPO}"
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            "https://gitlab.com/api/v4/projects/${encoded}")

          if [ "$status" = "404" ]; then
            visibility=$([ "$PRIVATE" = "true" ] && echo private || echo public)
            payload=$(jq -n \
              --arg name "$REPO" --arg desc "$DESC" --arg vis "$visibility" \
              '{name: $name, description: $desc, visibility: $vis}')
            curl -sSf -X POST \
              -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "https://gitlab.com/api/v4/projects" > /dev/null
            echo "Created GitLab project ${OWNER}/${REPO}"
          elif [ "$status" != "200" ]; then
            echo "::error::GitLab API returned $status for ${REPO}"
            exit 1
          fi

      - name: Ensure Gitee repository exists
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ matrix.repo.name }}
          DESC: ${{ matrix.repo.description }}
          PRIVATE: ${{ matrix.repo.private }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GITEE_TOKEN" \
            "https://gitee.com/api/v5/repos/${OWNER}/${REPO}")

          if [ "$status" = "404" ]; then
            payload=$(jq -n \
              --arg token "$GITEE_TOKEN" --arg name "$REPO" \
              --arg desc "$DESC" --argjson private "$PRIVATE" \
              '{access_token: $token, name: $name, description: $desc, private: $private}')
            curl -sSf -X POST \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "https://gitee.com/api/v5/user/repos" > /dev/null
            echo "Created Gitee repo ${OWNER}/${REPO}"
          elif [ "$status" != "200" ]; then
            echo "::error::Gitee API returned $status for ${REPO}"
            exit 1
          fi

      - name: Push mirror to GitLab
        id: push_gitlab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ matrix.repo.name }}
        run: |
          cd repo.git
          git push --mirror \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.com/${OWNER}/${REPO}.git"

      - name: Push mirror to Gitee
        if: always() && steps.push_gitlab.conclusion != 'cancelled'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ matrix.repo.name }}
        run: |
          cd repo.git
          git push --mirror \
            "https://${OWNER}:${GITEE_TOKEN}@gitee.com/${OWNER}/${REPO}.git"
