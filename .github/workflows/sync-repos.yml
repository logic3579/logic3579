name: Sync GitHub Repos to GitLab and Gitee

on:
  workflow_dispatch:
  schedule:
    # Every Sunday at 03:00 UTC
    - cron: "0 3 * * 0"

concurrency:
  group: sync-repos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  list_repos:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - name: List owned repositories
        id: list
        # actions/github-script@v9
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const all = await github.paginate(
              github.rest.repos.listForAuthenticatedUser,
              { per_page: 100, affiliation: 'owner', sort: 'full_name' }
            );
            const repos = all
              .filter(r => !r.fork && !r.archived)
              .map(r => ({
                name: r.name,
                private: r.private,
                // 100 chars keeps the matrix outputs well under the 1MB job-output cap
                // even when the user has hundreds of repos.
                description: (r.description || '').slice(0, 100),
                default_branch: r.default_branch,
              }));
            core.setOutput('repos', JSON.stringify(repos));
            core.setOutput('count', String(repos.length));
            await core.summary
              .addHeading(`Syncing ${repos.length} repositories`)
              .addList(repos.map(r => `${r.name}${r.private ? ' (private)' : ''}`))
              .write();

  sync:
    needs: list_repos
    if: needs.list_repos.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        repo: ${{ fromJSON(needs.list_repos.outputs.repos) }}
    steps:
      - name: Checkout sync scripts
        # actions/checkout@v5
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          sparse-checkout: |
            .github/scripts

      - name: Mirror clone from GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ matrix.repo.name }}
        run: bash .github/scripts/mirror-clone-github.sh

      - name: Sync to GitLab
        id: sync_gitlab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ matrix.repo.name }}
          DESC: ${{ matrix.repo.description }}
          PRIVATE: ${{ matrix.repo.private }}
          DEFAULT_BRANCH: ${{ matrix.repo.default_branch }}
        run: bash .github/scripts/sync-gitlab.sh

      - name: Sync to Gitee
        if: always() && steps.sync_gitlab.conclusion != 'cancelled'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ matrix.repo.name }}
          DESC: ${{ matrix.repo.description }}
          PRIVATE: ${{ matrix.repo.private }}
          DEFAULT_BRANCH: ${{ matrix.repo.default_branch }}
        run: bash .github/scripts/sync-gitee.sh
